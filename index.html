<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Market Mastery | Telegram Channel</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f0f0;
  }
  .container {
    max-width: 400px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
  }
  .header h1 {
    font-size: 24px;
    margin-bottom: 10px;
  }
  .header p {
    font-size: 16px;
    color: #666;
  }
  .features {
    margin-bottom: 20px;
  }
  .features h2 {
    font-size: 18px;
    margin-bottom: 10px;
  }
  .features ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .features li {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background-color: #f9f9f9;
  }
  .cta {
    text-align: center;
  }
  .cta a {
    display: inline-block;
    padding: 10px 20px;
    background-color: #4CAF50;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="https://example.com/logo.png" alt="Logo">
    <h1>Stock Market Mastery</h1>
    <p>Get expert insights and strategies for stock market success</p>
  </div>
  <div class="features">
    <h2>What you'll get:</h2>
    <ul>
      <li>🔥 Daily market analysis and trends</li>
      <li>📈 Expert stock picks and recommendations</li>
      <li>💡 Proven trading strategies and tips</li>
      <li>📊 Real-time market updates and alerts</li>
    </ul>
  </div>
  <div class="cta">
    <a href="https://t.me/yourchannel">Join our Telegram Channel</a>
  </div>
</div>
</body>
</html>
